name: Validation

on:
    pull_request:
    merge_group:
    push:
        branches: [master, main]

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || ((github.event_name == 'push' && github.sha) || github.ref) }}
    cancel-in-progress: true

permissions: read-all

env:
    # Most jobs use ring as the build script's crypto provider: it builds much
    # faster than the default aws-lc-rs. The Linters job and the Docker-based
    # tests keep the default, so aws-lc-rs stays covered.
    CARGO_FEATURE_FLAGS: --no-default-features --features ring --features serde

jobs:
    linters:
        name: Linters
        runs-on: ubuntu-latest
        env:
            CARGO_FEATURE_FLAGS: ""
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Format check
              run: make format_check
            - name: Run Clippy
              run: make clippy
            - name: Check aws-lc-rs is the default crypto provider
              run: |-
                  cargo tree --edges normal,build --invert aws-lc-sys --prefix none \
                    | grep -q '^aws-lc-sys v'
                  if cargo tree --edges normal,build --invert ring --prefix none 2>/dev/null \
                    | grep -q '^ring v'; then
                    echo "ring is in the default dependency graph" >&2
                    exit 1
                  fi

    licenses:
        name: Licenses
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Generate LICENSE_3rdparty.csv
              run: make LICENSE-3rdparty.csv
            - name: Check for changes
              run: |-
                git add LICENSE-3rdparty.csv
                git diff --exit-code

    tests:
        name: Test with libddwaf release binaries (${{ matrix.runs-on }})
        strategy:
            matrix:
                runs-on:
                    - ubuntu-latest
                    - macos-latest
                    - ubuntu-24.04-arm
                    - windows-latest
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Run Tests
              run: cargo test --all-targets ${{ env.CARGO_FEATURE_FLAGS }} && cargo test --doc ${{ env.CARGO_FEATURE_FLAGS }}
            - name: Run Dynamic Tests
              run: cargo test --all-targets ${{ env.CARGO_FEATURE_FLAGS }} --features dynamic
            - name: Run Dynamic Link Tests
              run: cargo test --all-targets ${{ env.CARGO_FEATURE_FLAGS }} --features dynamic-link

    source-tests-linux:
        name: Tests with libddwaf-src (${{ matrix.name }} | Linux)
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: static
                      features: source-static
                      expects_libddwaf: "no"
                    - name: embedded
                      features: source-shared,dynamic
                      expects_libddwaf: "no"
                    - name: dynamic-link
                      features: source-shared,dynamic-link
                      expects_libddwaf: "yes"
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: source-linux-${{ matrix.name }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Run Tests
              env:
                  FEATURES: ${{ matrix.features }}
              run: |-
                  cargo test --workspace --all-targets $CARGO_FEATURE_FLAGS --features "$FEATURES"
                  cargo test --workspace --doc $CARGO_FEATURE_FLAGS --features "$FEATURES"
            - name: Verify Linkage
              env:
                  EXPECTS_LIBDDWAF: ${{ matrix.expects_libddwaf }}
                  FEATURES: ${{ matrix.features }}
              run: |-
                  # libddwaf-sys has no serde feature; ring alone matches the flags above.
                  cargo test -p libddwaf-sys --test tests --no-default-features \
                    --features ring --features "$FEATURES" \
                    --no-run --message-format=json > target/source-test-artifacts.json
                  test_binary="$(jq -r '
                    select(
                      .reason == "compiler-artifact" and
                      .target.name == "tests" and
                      (.target.kind | index("test")) and
                      .executable != null
                    ) | .executable
                  ' target/source-test-artifacts.json)"
                  test -n "$test_binary"
                  dependencies="$(readelf -d "$test_binary")"
                  echo "$dependencies"
                  if grep -Fq 'Shared library: [libddwaf.so]' <<< "$dependencies"; then
                    actual=yes
                  else
                    actual=no
                  fi
                  test "$actual" = "$EXPECTS_LIBDDWAF"

    windows-gnu-image:
        name: Windows-GNU tools image
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        outputs:
            image: ${{ steps.image.outputs.image }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Build and Push if Missing
              id: image
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |-
                  # The tag is a hash of the Dockerfile, so this only builds
                  # when the Dockerfile changed.
                  image="$(.github/docker/windows-gnu-image-ref.sh)"
                  echo "image=$image" >> "$GITHUB_OUTPUT"
                  echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  if docker manifest inspect "$image" > /dev/null 2>&1; then
                    echo "$image is already published"
                    exit 0
                  fi
                  # The runners only resolve their own Azure Ubuntu mirror, and
                  # only from the host network, not from Docker's default one.
                  getent hosts azure.archive.ubuntu.com archive.ubuntu.com || true
                  docker build --network host -t "$image" \
                    --build-arg UBUNTU_MIRROR=http://azure.archive.ubuntu.com/ubuntu \
                    -f .github/docker/windows-gnu.Dockerfile .github/docker
                  docker push "$image"

    source-tests-windows:
        name: Tests with libddwaf-src (${{ matrix.name }} | Windows zigbuild + Wine)
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: static
                      features: source-static
                      expects_libddwaf: "no"
                    - name: embedded
                      features: source-shared,dynamic
                      expects_libddwaf: "no"
                    - name: dynamic-link
                      features: source-shared,dynamic-link
                      expects_libddwaf: "yes"
        needs: windows-gnu-image
        runs-on: ubuntu-latest
        env:
            WINDOWS_GNU_IMAGE: ${{ needs.windows-gnu-image.outputs.image }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  key: source-windows-zigbuild-${{ matrix.name }}
                  save-if: ${{ github.ref == 'refs/heads/main' }}
                  # Only the windows-gnu standard library: the rest of the
                  # toolchain ships with the runner image.
                  cache-directories: ~/.rustup/toolchains/*/lib/rustlib/x86_64-pc-windows-gnu
            - name: Fetch the Windows-GNU Tools Image
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |-
                  echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
                  docker pull "$WINDOWS_GNU_IMAGE"
                  # The build runs on the runner; it only needs zig from the image.
                  container="$(docker create "$WINDOWS_GNU_IMAGE")"
                  docker cp "$container:/opt/zig" "$RUNNER_TEMP/zig"
                  docker rm "$container" > /dev/null
                  echo "$RUNNER_TEMP/zig" >> "$GITHUB_PATH"
            - name: Install Test Tools
              run: |-
                  # Restored by the cache when present; rustup would not know,
                  # as its own bookkeeping under ~/.rustup is not cached.
                  if [ ! -d "$(rustc --print sysroot)/lib/rustlib/x86_64-pc-windows-gnu" ]; then
                    rustup target add x86_64-pc-windows-gnu
                  fi
                  cargo install cargo-zigbuild --locked --version 0.21.8
            - name: Build Tests
              env:
                  FEATURES: ${{ matrix.features }}
              run: |-
                  mkdir -p target
                  cargo zigbuild --workspace --all-targets \
                    --target x86_64-pc-windows-gnu $CARGO_FEATURE_FLAGS --features "$FEATURES" \
                    --message-format=json > target/source-test-artifacts.json
            - name: Run Tests with Wine
              run: |-
                  mapfile -t test_binaries < <(jq -r '
                    select(
                      .reason == "compiler-artifact" and
                      .profile.test and
                      .executable != null
                    ) | .executable
                  ' target/source-test-artifacts.json)
                  test "${#test_binaries[@]}" -gt 0
                  # Run as the runner's user so nothing root-owned lands in target/.
                  docker run --rm --user "$(id -u):$(id -g)" --env HOME=/tmp \
                    --volume "$GITHUB_WORKSPACE:$GITHUB_WORKSPACE" \
                    --workdir "$GITHUB_WORKSPACE" "$WINDOWS_GNU_IMAGE" \
                    sh -ec 'export WINEPREFIX="$(mktemp -d)"
                      for test_binary; do wine "$test_binary"; done' \
                    sh "${test_binaries[@]}"
            - name: Verify Linkage
              env:
                  EXPECTS_LIBDDWAF: ${{ matrix.expects_libddwaf }}
              run: |-
                  test_binary="$(jq -r '
                    select(
                      .reason == "compiler-artifact" and
                      .target.name == "tests" and
                      (.target.kind | index("test")) and
                      .executable != null
                    ) | .executable
                  ' target/source-test-artifacts.json)"
                  test -n "$test_binary"
                  dependencies="$(objdump -p "$test_binary")"
                  echo "$dependencies"
                  if grep -Fqi 'DLL Name: ddwaf.dll' <<< "$dependencies"; then
                    actual=yes
                  else
                    actual=no
                  fi
                  test "$actual" = "$EXPECTS_LIBDDWAF"

    docker-tests:
        name: Tests (${{ matrix.variant}} | ${{ matrix.runs-on == 'ubuntu-latest' && 'x86_64' || 'aarch64' }})
        strategy:
            matrix:
                runs-on: [ubuntu-latest, ubuntu-24.04-arm]
                variant: [alpine, lambda-al2]
            fail-fast: false
        runs-on: ${{ matrix.runs-on }}
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Test
              run: docker build -f ".github/workflows/pull_request/Dockerfile.${{ matrix.variant }}" .

    coverage:
        name: Coverage
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Install tools
              run: cargo +nightly install cargo-llvm-cov
            - name: Test Coverage
              run: make coverage
            - name: Upload Coverage Report
              uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
              with:
                    name: coverage-report
                    path: target/coverage/html
                    if-no-files-found: error

    leak-check:
        name: Leak Check
        runs-on: ubuntu-latest
        steps:
            - name: Checkout
              uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
            - name: Cache
              uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
              with:
                  save-if: ${{ github.ref == 'refs/heads/main' }}
            - name: Leak Check
              run: make leak_check

    complete:
        name: Complete
        needs: [linters, tests, source-tests-linux, windows-gnu-image, source-tests-windows, docker-tests, coverage, leak-check]
        if: '!cancelled()'
        runs-on: ubuntu-latest
        steps:
            - name: Success
              if: needs.linters.result == 'success' && needs.tests.result == 'success' && needs.source-tests-linux.result == 'success' && needs.windows-gnu-image.result == 'success' && needs.source-tests-windows.result == 'success' && needs.docker-tests.result == 'success' && needs.coverage.result == 'success' && needs.leak-check.result == 'success'
              run: echo 'Success!'
            - name: Failure
              if: needs.linters.result != 'success' || needs.tests.result != 'success' || needs.source-tests-linux.result != 'success' || needs.windows-gnu-image.result != 'success' || needs.source-tests-windows.result != 'success' || needs.docker-tests.result != 'success' || needs.coverage.result != 'success' || needs.leak-check.result != 'success'
              run: echo 'Failure!' && exit 1
