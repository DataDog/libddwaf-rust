[package]
name = "libddwaf-sys"
description = "Low-level bindings to DataDog/libddwaf"
authors.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
categories.workspace = true
keywords.workspace = true

links = "ddwaf"

[dependencies]
lazy_static = { version = "1.5", optional = true }
libc = "0.2"
libloading = { version = "0.8", optional = true }
# Keep source builds aligned with the libddwaf release selected by this crate's version.
libddwaf-src = { version = "=2.2.1", default-features = false, optional = true }
tempfile = { version = "3", optional = true }
tracing = { version = "0.1", optional = true }
zstd = { version = "0.14.3", optional = true }

[build-dependencies]
bindgen = "0.72"
flate2 = "1.1"
rustls = { version = "0.23", default-features = false }
rustls-native-certs = "0.8"
tar = "0.4"
ureq = { version = "3.5", default-features = false, features = ["rustls-no-provider"] }
zstd = "0.14.3"

[features]
default = ["aws-lc-rs"]
# aws-lc-rs is the default to keep the downloader FIPS-capable out of the box;
# switch to "ring" instead if aws-lc-sys's vendored jitterentropy C sources fail
# to compile under your toolchain/build flags (see DataDog/dd-trace-php#4162).
aws-lc-rs = ["rustls/aws-lc-rs"]
ring = ["rustls/ring"]
fips = ["rustls/fips"]
# Embeds a compressed libddwaf shared library and extracts it to a temporary file at runtime, then loads it with libloading
dynamic = [
    "lazy_static",
    "libloading",
    "libddwaf-src?/manual-link",
    "tempfile",
    "tracing",
    "zstd",
]
# Links to the libddwaf shared library dynamically (simpler, requires the library at runtime)
dynamic-link = []
# Builds and statically links libddwaf from source; required for Windows GNU static linking
source-static = ["dep:libddwaf-src", "libddwaf-src/static"]
# Builds shared libddwaf from the libddwaf-src crate for one of the dynamic modes
source-shared = ["dep:libddwaf-src", "libddwaf-src/shared"]

[lints]
workspace = true
